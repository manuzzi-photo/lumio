<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Lumio">
  <style>
    /* Die Tinte laeuft ueber currentColor, damit eine einzige Datei beide
       Browser-Themes bedient. Auf dunkler Leiste haette #12121A nur 1.16
       Kontrast und die Marke waere praktisch unsichtbar. */
    :root { color: #12121A; }
    @media (prefers-color-scheme: dark) {
      :root { color: #FAF8F5; }
    }
  </style>
  <defs>
    <clipPath id="cut" clip-rule="evenodd"><path d="M-40,-40 H150 V150 H-40 Z M-40,145.73 L150,-44.27 L150,-57 L-40,133 Z"/></clipPath>
  </defs>
  <g clip-path="url(#cut)">
      <rect x="0" y="0" width="46" height="46" rx="9" fill="#FF4D2E"/>
      <rect x="54" y="0" width="46" height="46" rx="9" fill="currentColor"/>
      <rect x="0" y="54" width="46" height="46" rx="9" fill="currentColor"/>
      <rect x="54" y="54" width="46" height="46" rx="9" fill="currentColor"/>
  </g>
</svg>
